# 应用服务 WEB 访问端口（设计说明书 §9.1：Spring Boot 8080）
server.port=8080

# ===== MyBatis 配置 =====
# 指定 Mapper XML 文件位置（resources/mappers）
mybatis.mapper-locations=classpath:mappers/*.xml
# 指定实体目录（数据库表实体，见《数据库设计说明书》第四章）
mybatis.type-aliases-package=com.example.classguard.entity
# 数据库列 snake_case 与实体 camelCase 自动映射（如 alarm_id -> alarmId）
mybatis.configuration.map-underscore-to-camel-case=true

