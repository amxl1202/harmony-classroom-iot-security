# 应用服务 WEB 访问端口（设计说明书 §9.1：Spring Boot 8080）
server.port=8080

# URL 查询参数时间绑定格式（API-05/07 的 from/to，REST 文档 §2，与 Jackson 序列化格式一致）
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss

# ===== MyBatis 配置 =====
# 指定 Mapper XML 文件位置（resources/mappers）
mybatis.mapper-locations=classpath:mappers/*.xml
# 指定实体目录（数据库表实体，见《数据库设计说明书》第四章）
mybatis.type-aliases-package=com.example.classguard.entity
# 数据库列 snake_case 与实体 camelCase 自动映射（如 alarm_id -> alarmId）
mybatis.configuration.map-underscore-to-camel-case=true

# ===== MySQL 数据源（D1 已确认：本机 MySQL 8.0.43，库名 classroom_security） =====
# 使用最小权限账号 classroom_app（仅 SELECT/INSERT/UPDATE，无 DDL/DELETE/管理权限），
# 由 classroom_security_user.sql 创建；不要用 root 跑应用 —— 一旦 SQL 注入或代码缺陷，
# 最小权限能把影响面限制在单库的增改查范围内。
spring.datasource.url=jdbc:mysql://localhost:3306/classroom_security?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=classroom_app
spring.datasource.password=Clsp_2026#Dev

